baseURL = "https://swiftlaggy.github.io/"
defaultContentLanguage = "en"
locale = "en"
title = "Jamie Gunner"
theme = "FixIt"
timeZone = "Europe/London"
enableGitInfo = true
enableRobotsTXT = true

[menu]
  [[menu.main]]  
    identifier = "Home"
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]  
    identifier = "About"
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 3
    
[params]
  description = "Website for Jamie Gunner."
  keywords = ["Jamie", "Gunner", "Jamie Gunner", "Hacking", "Ethical", "Ethical Hacking", "CV", "Projects"]
  default_theme = "dark"
  git_info = true
  fingerprint = ""
  date_format = "2006-01-02"
  images = ["/images/sw.svg"]

  [params.search]
    enable = true
    type = "lunr"
    content_length = 4000
    placeholder = ""
    max_result_length = 10
    snippet_length = 30
    highlight_tag = "em"
    absolute_url = false
    [params.search.algolia]
      index = ""
      app_id = ""
      search_key = ""

  [params.header]
    desktop_mode = "fixed"
    mobile_mode = "auto"
    [params.header.title]
      name = "Jamie Gunner"
      pre = ""
      post = ""
      typeit = false

  [params.footer]
    enable = true
    custom = ''
    hugo = false
    copyright = true
    author = true
    since = 2020
    icp = ""
    license = ''

  [params.section]
    paginate = 20
    date_format = "01-02"
    rss = 10

  [params.list]
    paginate = 20
    date_format = "01-02"
  
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatar_url = "/images/sw.jpeg"
      avatar_alt = "Temporary avatar"
      title = "Jamie Gunner"
      subtitle = "Master Graduate and SOC Analyst"
      disclaimer = "Welcome to my digital playground! Join me as I learn, problem-solve, and share my experiences tackling projects, mastering CTFs, and navigating TryHackMe and HackTheBox. Together, we'll decode the mysteries of technology!"

    [params.home.posts]
      enable = true
      paginate = 6
      default_hidden_from_home_page = false

  [params.social]
    GitHub = "SwiftLaggy"
    Linkedin = "jamie-gunner"
    Twitter = "SwiftLaggy"
    Reddit = "SwiftLaggy_"

  [params.page]
    hidden_from_home_page = false
    hidden_from_search = false
    twemoji = false
    lightgallery = false
    ruby = false
    fraction = false
    fontawesome = false
    link_to_markdown = false
    rss_full_text = false

    [params.page.toc]
      enable = true
      keep_static = true
      auto = true

    [params.page.math]
      enable = false
      block_left_delimiter = ""
      block_right_delimiter = ""
      inline_left_delimiter = ""
      inline_right_delimiter = ""
      copy_tex = true
      mhchem = true
      
    [params.page.code]
      copy = true
      max_shown_lines = 10

    [params.page.mapbox]
      access_token = ""
      light_style = "mapbox://styles/mapbox/light-v9"
      dark_style = "mapbox://styles/mapbox/dark-v9"
      navigation = true
      geolocate = true
      scale = true
      fullscreen = true

    [params.page.share]
      enable = false
      Twitter = true
      Facebook = true
      Linkedin = false
      Whatsapp = true
      Pinterest = false
      Tumblr = false
      HackerNews = false
      Reddit = false
      VK = false
      Buffer = false
      Xing = false
      Line = true
      Instapaper = false
      Pocket = false
      Digg = false
      Stumbleupon = false
      Flipboard = false
      Weibo = true
      Renren = false
      Myspace = true
      Blogger = true
      Baidu = false
      Odnoklassniki = false
      Evernote = true
      Skype = false
      Trello = false
      Mix = false

    [params.page.comment]
      enable = false
      [params.page.comment.utterances]
        enable = true
        repo = ""
        issue_term = "pathname"
        label = "Comments"
        light_theme = "github-light"
        dark_theme = "photon-dark"

    [params.page.seo]
      images = ["/images/sw.jpeg"]
      [params.page.seo.publisher]
        name = "Jamie Gunner"
        logo_url = "/images/sw.jpeg"

  [params.typeit]
    speed = 50
    cursor_speed = 1000
    cursor_char = "|"
    duration = -1

  [params.seo]
    image = ""
    thumbnail_url = ""

  [params.analytics]
    enable = false

  [params.cookieconsent]
    enable = false

  [params.compatibility]
    polyfill = false
    object_fit = false

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[sitemap]
    changefreq = "weekly"
    disable = false
    filename = "sitemap.xml"
    priority = 0.5

[Permalinks]
    posts = "posts/:filename"

[privacy]
  [privacy.googleAnalytics]
  [privacy.twitter]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"